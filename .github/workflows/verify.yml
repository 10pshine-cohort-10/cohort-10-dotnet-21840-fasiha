name: Verify Taskline

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run build

  api:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Build and test with SQLite
        run: dotnet test TaskManagement.slnx -c Release -p:TreatWarningsAsErrors=true
      - name: Start disposable SQL Server
        shell: bash
        run: |
          export MSSQL_SA_PASSWORD="Test-$(openssl rand -hex 18)-Aa1!"
          echo "::add-mask::$MSSQL_SA_PASSWORD"
          docker run -d --name taskline-sql -p 127.0.0.1:14331:1433 \
            -e ACCEPT_EULA=Y -e MSSQL_PID=Developer -e MSSQL_SA_PASSWORD \
            mcr.microsoft.com/mssql/server:2022-latest
          export SQLCMDPASSWORD="$MSSQL_SA_PASSWORD"
          for attempt in {1..60}; do
            if docker exec -e SQLCMDPASSWORD taskline-sql /opt/mssql-tools18/bin/sqlcmd \
              -S localhost -U sa -C -b -Q "SELECT 1" >/dev/null 2>&1; then
              echo "TASKMANAGEMENT_TEST_SQL=Server=127.0.0.1,14331;User ID=sa;Password=$MSSQL_SA_PASSWORD;Encrypt=True;TrustServerCertificate=True" >> "$GITHUB_ENV"
              exit 0
            fi
            sleep 2
          done
          docker logs taskline-sql
          exit 1
      - name: Test with SQL Server and apply migrations
        run: dotnet test TaskManagement.slnx -c Release --no-build
